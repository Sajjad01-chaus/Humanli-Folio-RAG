[project]
name = "folio-rag"
version = "0.1.0"
description = "Evidence-first conversational intelligence across PDF documents"
requires-python = ">=3.11,<3.14"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn>=0.34,<1", "pydantic>=2.10,<3",
  "pypdf>=5,<8", "numpy>=2,<3", "scikit-learn>=1.6,<2",
  "httpx>=0.28,<1", "python-multipart>=0.0.20,<1", "python-dotenv>=1,<2",
  "sentence-transformers>=3.4,<7",
  "langgraph==1.0.3", "langchain-core==1.0.5", "langsmith==0.4.37",
  "langgraph-checkpoint==2.1.2", "xxhash==3.6.0", "ormsgpack==1.10.0", "pypdfium2>=4,<6",
  "tiktoken==0.12.0",
]
[project.optional-dependencies]
dev = ["pytest>=8,<10", "reportlab>=4,<6", "ruff>=0.11,<1", "mypy==2.4.1", "types-reportlab"]
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
[tool.ruff]
line-length = 110
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["app", "scripts"]

[[tool.mypy.overrides]]
module = ["sentence_transformers.*", "sklearn.*", "scipy.*", "pypdfium2.*"]
ignore_missing_imports = true
follow_imports = "skip"
